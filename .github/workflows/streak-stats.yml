name: Update GitHub Streak

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate streak stats
        uses: zients/github-readme-streak-stats@v2
        with:
          user: ganeshkumar1887
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: theme=tokyonight&hide_border=true&disable_animations=true
